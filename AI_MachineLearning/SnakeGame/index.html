<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #111827);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
    }

    .game-container {
      width: min(90vw, 620px);
      text-align: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    .info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      font-size: 1rem;
      flex-wrap: wrap;
    }

    .score {
      font-weight: bold;
      color: #a7f3d0;
    }

    .controls {
      font-size: 0.92rem;
      color: #cbd5e1;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #0b1220;
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #16a34a;
      transform: translateY(-1px);
    }

    button.secondary {
      background: #334155;
    }

    button.secondary:hover {
      background: #475569;
    }

    .message {
      margin-top: 12px;
      min-height: 24px;
      font-weight: bold;
      color: #fca5a5;
    }

    .touch-controls {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      justify-content: center;
      gap: 8px;
      user-select: none;
      touch-action: manipulation;
    }

    .touch-controls button {
      width: 60px;
      height: 60px;
      font-size: 1.2rem;
      padding: 0;
      border-radius: 12px;
      background: #1e293b;
    }

    .touch-controls button:hover {
      background: #334155;
    }

    .empty {
      visibility: hidden;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 1.6rem;
      }

      .controls {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Snake Game</h1>

    <div class="info">
      <div>Score: <span class="score" id="score">0</span></div>
      <div>High Score: <span class="score" id="highScore">0</span></div>
    </div>

    <div class="controls">
      Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to move.<br />
      Press <strong>Space</strong> to pause/resume.
    </div>

    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div class="buttons">
      <button id="restartBtn">Restart</button>
      <button id="pauseBtn" class="secondary">Pause</button>
    </div>

    <div class="message" id="message"></div>

    <div class="touch-controls" aria-label="Touch controls">
      <div class="empty"></div>
      <button id="upBtn">↑</button>
      <div class="empty"></div>

      <button id="leftBtn">←</button>
      <div class="empty"></div>
      <button id="rightBtn">→</button>

      <div class="empty"></div>
      <button id="downBtn">↓</button>
      <div class="empty"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const messageEl = document.getElementById("message");
    const restartBtn = document.getElementById("restartBtn");
    const pauseBtn = document.getElementById("pauseBtn");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake, direction, nextDirection, food, score, highScore, gameOver, paused;
    let lastRenderTime = 0;
    let gameSpeed = 5; // slower speed
    let animationId = null;

    highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
    highScoreEl.textContent = highScore;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      paused = false;
      lastRenderTime = 0;
      scoreEl.textContent = score;
      messageEl.textContent = "";
      pauseBtn.textContent = "Pause";
      spawnFood();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function gameLoop(timestamp) {
      if (!gameOver && !paused) {
        const secondsSinceLastRender = (timestamp - lastRenderTime) / 1000;
        if (secondsSinceLastRender >= 1 / gameSpeed) {
          lastRenderTime = timestamp;
          update();
        }
      }

      draw();
      animationId = requestAnimationFrame(gameLoop);
    }

    function update() {
      if (
        (nextDirection.x !== 0 && nextDirection.x === -direction.x) ||
        (nextDirection.y !== 0 && nextDirection.y === -direction.y)
      ) {
        nextDirection = direction;
      }

      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
      ) {
        endGame();
        return;
      }

      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;

        if (score > highScore) {
          highScore = score;
          localStorage.setItem("snakeHighScore", highScore);
          highScoreEl.textContent = highScore;
        }

        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.fillStyle = "#0b1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(255,255,255,0.05)";
      for (let i = 0; i < tileCount; i++) {
        for (let j = 0; j < tileCount; j++) {
          ctx.strokeRect(i * gridSize, j * gridSize, gridSize, gridSize);
        }
      }

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2.5,
        0,
        Math.PI * 2
      );
      ctx.fill();

      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#22c55e" : "#86efac";
        ctx.fillRect(
          segment.x * gridSize,
          segment.y * gridSize,
          gridSize,
          gridSize
        );

        ctx.strokeStyle = "#0b1220";
        ctx.strokeRect(
          segment.x * gridSize + 1,
          segment.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      });

      if (paused) {
        overlayText("Paused");
      }

      if (gameOver) {
        overlayText("Game Over");
      }
    }

    function overlayText(text) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "white";
      ctx.font = "bold 36px Arial";
      ctx.textAlign = "center";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2 - 10);

      ctx.font = "18px Arial";
      ctx.fillText("Press Restart to play again", canvas.width / 2, canvas.height / 2 + 25);
    }

    function endGame() {
      gameOver = true;
      messageEl.textContent = "Game Over! Click Restart to try again.";
    }

    function setDirection(x, y) {
      if (snake.length > 1) {
        if (x === -direction.x && y === -direction.y) return;
      }
      nextDirection = { x, y };
    }

    document.addEventListener("keydown", (e) => {
      switch (e.key.toLowerCase()) {
        case "arrowup":
        case "w":
          setDirection(0, -1);
          break;
        case "arrowdown":
        case "s":
          setDirection(0, 1);
          break;
        case "arrowleft":
        case "a":
          setDirection(-1, 0);
          break;
        case "arrowright":
        case "d":
          setDirection(1, 0);
          break;
        case " ":
          togglePause();
          break;
      }
    });

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? "Resume" : "Pause";
      messageEl.textContent = paused ? "Game paused." : "";
    }

    pauseBtn.addEventListener("click", togglePause);

    restartBtn.addEventListener("click", () => {
      resetGame();
    });

    document.getElementById("upBtn").addEventListener("click", () => setDirection(0, -1));
    document.getElementById("downBtn").addEventListener("click", () => setDirection(0, 1));
    document.getElementById("leftBtn").addEventListener("click", () => setDirection(-1, 0));
    document.getElementById("rightBtn").addEventListener("click", () => setDirection(1, 0));

    // Start game
    resetGame();
    animationId = requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
